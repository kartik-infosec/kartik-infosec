<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Awareness Demo</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4e73df, #1cc88a);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
    }

    .container {
        background: white;
        padding: 30px;
        border-radius: 10px;
        width: 320px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        text-align: center;
    }

    h2 {
        margin-bottom: 20px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #4e73df;
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background-color: #2e59d9;
    }

    .warning {
        margin-top: 15px;
        font-size: 14px;
        color: red;
        display: none;
    }
</style>
</head>
<body>

<div class="container">
    <h2>Login Portal</h2>
    <form onsubmit="showWarning(event)">
        <input type="text" placeholder="Email" required>
        <input type="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
    <div class="warning" id="warningMessage">
        ⚠ This was a phishing awareness test.  
        Always verify the sender and URL before entering credentials.
    </div>
</div>

<script>
function showWarning(event) {
    event.preventDefault();
    document.getElementById("warningMessage").style.display = "block";
}
</script>

</body>
</html>
