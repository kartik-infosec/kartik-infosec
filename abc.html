<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Security Awareness Demo</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    text-align: center;
}

.box {
    background: #222;
    padding: 30px;
    border-radius: 10px;
    width: 400px;
    box-shadow: 0 0 25px rgba(255,0,0,0.6);
}

h2 {
    color: #ff4d4d;
}

button {
    margin-top: 15px;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    background: #007bff;
    color: white;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="box">
    <h2>⚠ You Clicked a Suspicious Link</h2>
    <p id="message">Simulating what a malicious site might attempt...</p>
    <button onclick="resetDemo()">Reset Demo</button>
</div>

<script>
window.onload = function() {
    const message = document.getElementById("message");

    setTimeout(() => {
        message.innerHTML = "🔍 Attempting to access browser data...";
    }, 1500);

    setTimeout(() => {
        message.innerHTML = "📡 Attempting to send data to remote server...";
    }, 3000);

    setTimeout(() => {
        message.innerHTML = "🔄 Attempting forced redirect...";
    }, 4500);

    setTimeout(() => {
        message.innerHTML = "✅ This was a SAFE cybersecurity awareness simulation.<br><br>JavaScript can run automatically when visiting a website. Always verify links before clicking.";
    }, 6000);
};

function resetDemo() {
    location.reload();
}
</script>

</body>
</html>
